services:
  postgres:
    image: postgres:17-alpine
    container_name: lab-resource-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: labresource
      POSTGRES_USER: labresource
      POSTGRES_PASSWORD: labresource-local-dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lab-resource-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labresource -d labresource"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lab-resource-postgres:
